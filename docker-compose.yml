name: small-party-world

# Small Party World 게임 서버 (spwsv.cloudish.cloud)
# - 7777: 게임 접속 (평문 WebSocket)
# - 7778: 상태 페이지 (HTTP, / = 상태 화면, /health = 헬스체크)
# - 외부 접속은 Caddy가 https 443 으로 받아, WebSocket 요청은 7777 / 그 외는 7778 로 전달
services:
  small-party-world-server:
    build: .
    image: small-party-world-server:latest
    container_name: small-party-world-server
    restart: unless-stopped
    environment:
      - GAME_PORT=7777
      - STATUS_PORT=7778
      # 점검 모드를 읽어 올 관리 서버 (같은 compose 네트워크)
      - ADMIN_URL=http://small-party-world-admin:7780
    # [A] Caddy를 호스트(Ubuntu)에 직접 설치한 경우: 로컬에서만 열기
    ports:
      - "127.0.0.1:7777:7777"
      - "127.0.0.1:7778:7778"
    # [B] Caddy도 Docker 컨테이너인 경우: 위 ports 대신 Caddy와 같은 네트워크에 연결
    #     (네트워크 이름은 Caddy compose 쪽 이름으로 바꾸세요)
    # networks:
    #   - caddy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 관리 서버: 관리 페이지(https://spw.cloudish.cloud/admin/) + 공지 API(/api/notices) + 점검 모드
  #   구글 로그인: GOOGLE_CLIENT_ID (GitHub Actions 변수 또는 이 폴더의 .env)
  #   관리자 계정: ADMIN_EMAILS (쉼표로 구분, 항상 관리자) + 관리 페이지에서 추가한 계정
  #   데이터: /srv/small_party_world/admin/admin.sqlite
  small-party-world-admin:
    build: admin
    image: small-party-world-admin:latest
    container_name: small-party-world-admin
    restart: unless-stopped
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-cshee8508@gmail.com}
      # 게임 로그인 (소셜 로그인). 값이 있는 제공자만 게임에 버튼이 보임 — README "계정·로그인" 참고
      - PUBLIC_URL=https://spw.cloudish.cloud
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - APPLE_SERVICE_ID=${APPLE_SERVICE_ID:-}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:7780:7780"
    volumes:
      - /srv/small_party_world/admin:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 웹 빌더: 소스를 웹으로 내보내 Caddy가 제공하는 폴더(spw.cloudish.cloud)에 배포
  #   docker compose --profile build run --rm web-build
  #   웹 + Windows zip(/download/SmallPartyWorld-windows.zip) 을 함께 만든다. 웹만: -e BUILD_WINDOWS=0
  web-build:
    profiles: ["build"]
    build: deploy/web-build
    image: small-party-world-web-builder:4.7.1-zip
    # 빌드 스크립트는 이미지에 굽지 않고 소스 폴더의 최신 파일을 sh 로 바로 실행
    # (스크립트를 고쳐도 이미지 재빌드 불필요, 실행 권한(+x)이 없어도 됨)
    entrypoint: ["sh", "/game/deploy/web-build/build.sh"]
    volumes:
      - ./:/game
      - /srv/small_party_world/web:/out

