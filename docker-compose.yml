# casual_games 게임 서버
# - 컨테이너 안에서는 평문 WebSocket(ws) 7777 포트로 대기
# - 외부 접속은 Caddy가 https(wss) 443 으로 받아 이 컨테이너로 전달
services:
  casual-games-server:
    build: .
    image: casual-games-server:latest
    container_name: casual-games-server
    restart: unless-stopped
    environment:
      - GAME_PORT=7777
    # [A] Caddy를 호스트(Ubuntu)에 직접 설치한 경우: 로컬에서만 열기
    ports:
      - "127.0.0.1:7777:7777"
    # [B] Caddy도 Docker 컨테이너인 경우: 위 ports 대신 Caddy와 같은 네트워크에 연결
    #     (네트워크 이름은 Caddy compose 쪽 이름으로 바꾸세요)
    # networks:
    #   - caddy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# networks:
#   caddy:
#     external: true
