name: small-party-world

# Small Party World 게임 서버 (spwsv.cloudish.cloud)
# - 7777: 게임 접속 (평문 WebSocket)
# - 7778: 상태 페이지 (HTTP, / = 상태 화면, /health = 헬스체크)
# - 외부 접속은 Caddy가 https 443 으로 받아, WebSocket 요청은 7777 / 그 외는 7778 로 전달
services:
  small-party-world-server:
    build: .
    image: small-party-world-server:latest
    container_name: small-party-world-server
    restart: unless-stopped
    environment:
      - GAME_PORT=7777
      - STATUS_PORT=7778
    # [A] Caddy를 호스트(Ubuntu)에 직접 설치한 경우: 로컬에서만 열기
    ports:
      - "127.0.0.1:7777:7777"
      - "127.0.0.1:7778:7778"
    # [B] Caddy도 Docker 컨테이너인 경우: 위 ports 대신 Caddy와 같은 네트워크에 연결
    #     (네트워크 이름은 Caddy compose 쪽 이름으로 바꾸세요)
    # networks:
    #   - caddy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 웹 빌더: 소스를 웹으로 내보내 Caddy가 제공하는 폴더(spw.cloudish.cloud)에 배포
  #   docker compose --profile build run --rm web-build
  #   (Windows 실행 파일도 함께: docker compose --profile build run --rm -e BUILD_WINDOWS=1 web-build)
  web-build:
    profiles: ["build"]
    build: deploy/web-build
    image: small-party-world-web-builder:4.7.2
    volumes:
      - ./:/game
      - /srv/small_party_world/web:/out

