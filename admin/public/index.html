<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>관리 · Small Party World</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root { --ink: #1d3557; --cream: #fff7e8; --red: #e63946; --blue: #457b9d; --yellow: #ffb703; --teal: #2a9d8f; --muted: #5e6b80; --soft: #fbedd4; --line: #e3d6bd; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--soft); color: var(--ink); font: 15px/1.5 "Pretendard", system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--ink); color: var(--cream); }
header h1 { font-size: 18px; margin: 0; flex: 1; }
header .who { font-size: 13px; opacity: .85; }
main { max-width: 980px; margin: 0 auto; padding: 20px; }
.card { background: var(--cream); border: 2px solid var(--ink); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
.card h2 { margin: 0 0 12px; font-size: 18px; }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.tabs button { background: #fff; color: var(--ink); border: 2px solid var(--ink); }
.tabs button.on { background: var(--ink); color: var(--cream); }
button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 7px 16px; cursor: pointer; background: var(--teal); color: #fff; }
button.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
button.red { background: var(--red); }
button.small { padding: 3px 10px; font-size: 13px; }
button:disabled { opacity: .5; cursor: default; }
label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
input[type=text], input[type=email], input[type=datetime-local], select, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 2px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
textarea { min-height: 140px; resize: vertical; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 160px; }
.checks { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.checks label { display: inline-flex; gap: 6px; align-items: center; margin: 0; font-weight: 500; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); }
.tag { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; color: #fff; background: var(--blue); }
.tag.banner { background: var(--yellow); color: var(--ink); } .tag.popup { background: var(--red); } .tag.patch { background: var(--teal); }
.muted { color: var(--muted); font-size: 13px; }
.msg { min-height: 20px; font-size: 14px; margin-top: 8px; }
.msg.err { color: var(--red); } .msg.ok { color: var(--teal); }
#login { max-width: 420px; margin: 80px auto; text-align: center; }
.hidden { display: none !important; }
.switch { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }
.switch input { width: 20px; height: 20px; }
</style>
</head>
<body>
<header>
  <h1>Small Party World 관리</h1>
  <span class="who" id="who"></span>
  <button class="ghost small hidden" id="logout" style="color:var(--cream);border-color:#ffffff55">로그아웃</button>
</header>

<section id="login" class="card">
  <h2>관리자 로그인</h2>
  <p class="muted">등록된 구글 계정으로만 들어올 수 있어요.</p>
  <div id="gbtn" style="display:flex;justify-content:center;margin:18px 0"></div>
  <div class="msg err" id="login-msg"></div>
</section>

<main id="app" class="hidden">
  <div class="tabs">
    <button data-tab="notices" class="on">공지</button>
    <button data-tab="maint">점검 모드</button>
    <button data-tab="admins">관리자</button>
    <button data-tab="audit">기록</button>
  </div>

  <!-- 공지 -->
  <section data-pane="notices">
    <div class="card">
      <h2 id="form-title">새 공지</h2>
      <div class="row">
        <div>
          <label for="f-kind">종류</label>
          <select id="f-kind">
            <option value="notice">공지 (소식 목록)</option>
            <option value="banner">배너 (첫 화면 위 띠)</option>
            <option value="popup">팝업 (처음 한 번 자동으로 열림)</option>
            <option value="patch">패치 노트</option>
          </select>
        </div>
        <div style="flex:2">
          <label for="f-title">제목 (80자)</label>
          <input type="text" id="f-title" maxlength="80">
        </div>
      </div>
      <label for="f-body">본문 (줄바꿈 그대로 표시)</label>
      <textarea id="f-body" maxlength="4000"></textarea>
      <label>대상 기기 (아무것도 안 고르면 전체)</label>
      <div class="checks">
        <label><input type="checkbox" name="plat" value="pc"> PC</label>
        <label><input type="checkbox" name="plat" value="android"> Android</label>
        <label><input type="checkbox" name="plat" value="ios"> iOS</label>
        <label><input type="checkbox" name="plat" value="web"> 웹</label>
      </div>
      <div class="row">
        <div><label for="f-start">게시 시작 (비우면 바로)</label><input type="datetime-local" id="f-start"></div>
        <div><label for="f-end">게시 끝 (비우면 계속)</label><input type="datetime-local" id="f-end"></div>
        <div><label for="f-minv">대상 버전 이상</label><input type="text" id="f-minv" placeholder="예: 0.2.0"></div>
        <div><label for="f-maxv">대상 버전 이하</label><input type="text" id="f-maxv" placeholder="예: 0.2.9"></div>
      </div>
      <div class="checks" style="margin-top:12px">
        <label><input type="checkbox" id="f-pinned"> 맨 위 고정</label>
        <label><input type="checkbox" id="f-published" checked> 게시 (끄면 임시 저장)</label>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button id="f-save">저장</button>
        <button class="ghost" id="f-cancel">새로 쓰기</button>
      </div>
      <div class="msg" id="f-msg"></div>
    </div>
    <div class="card">
      <h2>공지 목록</h2>
      <table><thead><tr><th>종류</th><th>제목</th><th>대상</th><th>기간</th><th>상태</th><th></th></tr></thead><tbody id="n-list"></tbody></table>
    </div>
  </section>

  <!-- 점검 -->
  <section data-pane="maint" class="hidden">
    <div class="card">
      <h2>점검 모드</h2>
      <p class="muted">켜면 게임 서버가 새 접속(로그인)과 방 만들기를 막고, 게임 첫 화면에 아래 문구를 띄워요. 진행 중인 경기는 끝까지 이어져요.</p>
      <label class="switch"><input type="checkbox" id="m-on"> 점검 중</label>
      <label for="m-msg">안내 문구</label>
      <input type="text" id="m-msg" maxlength="200" placeholder="예: 22:00~22:30 서버 점검 중이에요">
      <div style="margin-top:12px"><button id="m-save">저장</button></div>
      <div class="msg" id="m-msg-out"></div>
    </div>
  </section>

  <!-- 관리자 -->
  <section data-pane="admins" class="hidden">
    <div class="card">
      <h2>관리자 구글 계정</h2>
      <p class="muted">여기 있는 구글 계정만 이 페이지에 로그인할 수 있어요. 서버 설정(ADMIN_EMAILS)의 계정은 지울 수 없어요.</p>
      <table><thead><tr><th>계정</th><th>등록한 사람</th><th>등록일</th><th></th></tr></thead><tbody id="a-list"></tbody></table>
      <div class="row" style="margin-top:12px;align-items:flex-end">
        <div style="flex:3"><label for="a-email">추가할 구글 계정</label><input type="email" id="a-email" placeholder="someone@gmail.com"></div>
        <div style="flex:0"><button id="a-add">추가</button></div>
      </div>
      <div class="msg" id="a-msg"></div>
    </div>
  </section>

  <!-- 기록 -->
  <section data-pane="audit" class="hidden">
    <div class="card">
      <h2>최근 기록 (100건)</h2>
      <table><thead><tr><th>시각</th><th>계정</th><th>작업</th><th>내용</th></tr></thead><tbody id="l-list"></tbody></table>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var editing = null;   // 수정 중인 공지 id
  var notices = [];

  function api(method, url, body) {
    return fetch(url, {
      method: method,
      headers: { "Content-Type": "application/json", "X-SPW-Admin": "1" },
      body: body === undefined ? undefined : JSON.stringify(body),
      credentials: "same-origin",
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) { var e = new Error(d.error || ("오류 " + r.status)); e.status = r.status; throw e; }
        return d;
      });
    });
  }
  function msg(el, text, ok) { el.textContent = text || ""; el.className = "msg " + (ok ? "ok" : "err"); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(iso) { if (!iso) return ""; var d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("ko-KR", { dateStyle: "short", timeStyle: "short" }); }
  function toLocalInput(iso) {
    if (!iso) return "";
    var d = new Date(iso); var off = d.getTimezoneOffset() * 60000;
    return new Date(d - off).toISOString().slice(0, 16);
  }
  var KIND = { notice: "공지", banner: "배너", popup: "팝업", patch: "패치 노트" };
  var PLAT = { pc: "PC", android: "Android", ios: "iOS", web: "웹" };

  // ---- 로그인
  function showLogin(text) {
    $("app").classList.add("hidden"); $("logout").classList.add("hidden"); $("who").textContent = "";
    $("login").classList.remove("hidden");
    msg($("login-msg"), text || "");
    fetch("/admin/config").then(function (r) { return r.json(); }).then(function (c) {
      if (!c.client_id) { msg($("login-msg"), "서버에 GOOGLE_CLIENT_ID 가 설정되지 않았어요"); return; }
      (function wait() {
        if (!window.google || !google.accounts || !google.accounts.id) return setTimeout(wait, 100);
        google.accounts.id.initialize({ client_id: c.client_id, callback: onCredential, ux_mode: "popup" });
        google.accounts.id.renderButton($("gbtn"), { theme: "filled_blue", size: "large", text: "signin_with", locale: "ko" });
      })();
    });
  }
  function onCredential(resp) {
    api("POST", "/admin/api/login", { credential: resp.credential })
      .then(function () { start(); })
      .catch(function (e) { msg($("login-msg"), e.message); });
  }
  function start() {
    api("GET", "/admin/api/me").then(function (me) {
      $("login").classList.add("hidden"); $("app").classList.remove("hidden"); $("logout").classList.remove("hidden");
      $("who").textContent = me.email;
      loadNotices(); loadMaint(); loadAdmins(); loadAudit();
    }).catch(function () { showLogin(""); });
  }
  $("logout").onclick = function () { api("POST", "/admin/api/logout").finally(function () { showLogin("로그아웃했어요"); }); };

  // ---- 탭
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll(".tabs button").forEach(function (x) { x.classList.toggle("on", x === b); });
      document.querySelectorAll("[data-pane]").forEach(function (p) { p.classList.toggle("hidden", p.dataset.pane !== b.dataset.tab); });
      if (b.dataset.tab === "audit") loadAudit();
    };
  });
  function guard(e, el) { if (e.status === 401) showLogin("다시 로그인해 주세요"); else msg(el, e.message); }

  // ---- 공지
  function loadNotices() {
    api("GET", "/admin/api/notices").then(function (d) {
      notices = d.notices;
      var now = new Date().toISOString();
      $("n-list").innerHTML = notices.map(function (n) {
        var state = !n.published ? "임시 저장" : (n.starts_at && n.starts_at > now) ? "예약" : (n.ends_at && n.ends_at <= now) ? "끝남" : "게시 중";
        var plats = n.platforms.length ? n.platforms.map(function (p) { return PLAT[p]; }).join(", ") : "전체";
        var period = (n.starts_at || n.ends_at) ? (fmt(n.starts_at) || "바로") + " ~ " + (fmt(n.ends_at) || "계속") : "항상";
        return "<tr><td><span class='tag " + n.kind + "'>" + KIND[n.kind] + "</span></td><td>" + (n.pinned ? "📌 " : "") + esc(n.title) +
          "</td><td>" + plats + "</td><td class='muted'>" + period + "</td><td>" + state +
          "</td><td style='white-space:nowrap'><button class='small ghost' data-edit='" + n.id + "'>수정</button> <button class='small red' data-del='" + n.id + "'>삭제</button></td></tr>";
      }).join("") || "<tr><td colspan='6' class='muted'>아직 공지가 없어요</td></tr>";
    }).catch(function (e) { guard(e, $("f-msg")); });
  }
  $("n-list").onclick = function (ev) {
    var t = ev.target;
    if (t.dataset.edit) {
      var n = notices.find(function (x) { return String(x.id) === t.dataset.edit; });
      editing = n.id; $("form-title").textContent = "공지 수정 #" + n.id;
      $("f-kind").value = n.kind; $("f-title").value = n.title; $("f-body").value = n.body;
      document.querySelectorAll("input[name=plat]").forEach(function (c) { c.checked = n.platforms.indexOf(c.value) >= 0; });
      $("f-start").value = toLocalInput(n.starts_at); $("f-end").value = toLocalInput(n.ends_at);
      $("f-minv").value = n.min_version; $("f-maxv").value = n.max_version;
      $("f-pinned").checked = n.pinned; $("f-published").checked = n.published;
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else if (t.dataset.del) {
      if (!confirm("이 공지를 지울까요? 되돌릴 수 없어요.")) return;
      api("DELETE", "/admin/api/notices/" + t.dataset.del).then(function () { if (String(editing) === t.dataset.del) resetForm(); loadNotices(); })
        .catch(function (e) { guard(e, $("f-msg")); });
    }
  };
  function resetForm() {
    editing = null; $("form-title").textContent = "새 공지";
    ["f-title", "f-body", "f-start", "f-end", "f-minv", "f-maxv"].forEach(function (id) { $(id).value = ""; });
    $("f-kind").value = "notice"; $("f-pinned").checked = false; $("f-published").checked = true;
    document.querySelectorAll("input[name=plat]").forEach(function (c) { c.checked = false; });
  }
  $("f-cancel").onclick = function () { resetForm(); msg($("f-msg"), ""); };
  $("f-save").onclick = function () {
    var body = {
      kind: $("f-kind").value, title: $("f-title").value, body: $("f-body").value,
      platforms: Array.prototype.map.call(document.querySelectorAll("input[name=plat]:checked"), function (c) { return c.value; }),
      starts_at: $("f-start").value ? new Date($("f-start").value).toISOString() : "",
      ends_at: $("f-end").value ? new Date($("f-end").value).toISOString() : "",
      min_version: $("f-minv").value, max_version: $("f-maxv").value,
      pinned: $("f-pinned").checked, published: $("f-published").checked,
    };
    $("f-save").disabled = true;
    (editing ? api("PUT", "/admin/api/notices/" + editing, body) : api("POST", "/admin/api/notices", body))
      .then(function () { msg($("f-msg"), "저장했어요", true); resetForm(); loadNotices(); })
      .catch(function (e) { guard(e, $("f-msg")); })
      .finally(function () { $("f-save").disabled = false; });
  };

  // ---- 점검
  function loadMaint() {
    api("GET", "/admin/api/maintenance").then(function (m) { $("m-on").checked = m.on; $("m-msg").value = m.message; });
  }
  $("m-save").onclick = function () {
    api("PUT", "/admin/api/maintenance", { on: $("m-on").checked, message: $("m-msg").value })
      .then(function (m) { msg($("m-msg-out"), m.on ? "점검 모드를 켰어요 (게임 서버에 15초 안에 반영)" : "점검 모드를 껐어요", true); })
      .catch(function (e) { guard(e, $("m-msg-out")); });
  };

  // ---- 관리자
  function loadAdmins() {
    api("GET", "/admin/api/admins").then(function (d) {
      $("a-list").innerHTML = d.admins.map(function (a) {
        return "<tr><td>" + esc(a.email) + (a.owner ? " <span class='tag'>서버 설정</span>" : "") + "</td><td class='muted'>" + esc(a.added_by) +
          "</td><td class='muted'>" + fmt(a.added_at) + "</td><td>" + (a.owner ? "" : "<button class='small red' data-rm='" + esc(a.email) + "'>삭제</button>") + "</td></tr>";
      }).join("");
    }).catch(function (e) { guard(e, $("a-msg")); });
  }
  $("a-list").onclick = function (ev) {
    var e = ev.target.dataset.rm; if (!e) return;
    if (!confirm(e + " 계정의 관리자 권한을 뺄까요?")) return;
    api("DELETE", "/admin/api/admins/" + encodeURIComponent(e)).then(loadAdmins).catch(function (er) { guard(er, $("a-msg")); });
  };
  $("a-add").onclick = function () {
    api("POST", "/admin/api/admins", { email: $("a-email").value }).then(function () { $("a-email").value = ""; msg($("a-msg"), "추가했어요", true); loadAdmins(); })
      .catch(function (e) { guard(e, $("a-msg")); });
  };

  // ---- 기록
  var ACT = { login: "로그인", login_denied: "로그인 거부", notice_create: "공지 작성", notice_update: "공지 수정", notice_delete: "공지 삭제",
    maintenance_on: "점검 켬", maintenance_off: "점검 끔", admin_add: "관리자 추가", admin_remove: "관리자 삭제" };
  function loadAudit() {
    api("GET", "/admin/api/audit").then(function (d) {
      $("l-list").innerHTML = d.audit.map(function (a) {
        return "<tr><td class='muted'>" + fmt(a.at) + "</td><td>" + esc(a.email) + "</td><td>" + (ACT[a.action] || esc(a.action)) + "</td><td class='muted'>" + esc(a.detail) + "</td></tr>";
      }).join("");
    }).catch(function () {});
  }

  start();
})();
</script>
</body>
</html>
