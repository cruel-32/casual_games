# main 브랜치에 푸시하면 홈서버의 셀프 호스티드 러너가:
#   게임 서버 재빌드·재시작 + 웹(안내 페이지·웹 체험판·Windows zip) 빌드·배포 + 상태 확인
# (Android·iOS 앱은 PC에서 직접 빌드해 스토어에 올린다 — README 참고)
# 수동 실행: GitHub > Actions > build-deploy > Run workflow
#
# 필요한 설정은 README "자동 배포 (GitHub Actions)" 참고.
# 보안: 공개 저장소라서 pull_request 로는 절대 실행하지 않는다 (외부인 코드가 홈서버에서 돌 수 있음)

name: build-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: 서버·웹 배포 (홈서버)
    runs-on: [self-hosted, homeserver]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 게임 서버 다시 빌드·재시작
        run: docker compose -p spw up -d --build small-party-world-server

      - name: 웹 + Windows zip 빌드·배포
        run: |
          docker compose -p spw build web-build
          docker compose -p spw --profile build run --rm web-build

      - name: 서버 상태 확인
        run: |
          sleep 5
          curl -fsS http://127.0.0.1:7778/status.json
