<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소식 · Small Party World</title>
<meta name="description" content="Small Party World 공지사항과 업데이트 소식">
<meta name="theme-color" content="#fff7e8">
<link rel="icon" href="/assets/icon.png">
<style>
@font-face { font-family: "Jua"; src: url("/assets/Jua-Regular.ttf") format("truetype"); font-display: swap; }
:root { --ink: #1d3557; --cream: #fff7e8; --red: #e63946; --blue: #457b9d; --yellow: #ffb703; --teal: #2a9d8f; --muted: #5e6b80; --soft: #fbedd4; }
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--cream); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
a { color: inherit; }
.disp { font-family: "Jua", system-ui, sans-serif; font-weight: 400; }
nav { background: var(--ink); color: var(--cream); }
nav .inner { max-width: 820px; margin: 0 auto; padding: 12px 18px; display: flex; gap: 16px; align-items: center; }
nav .brand { flex: 1; font-size: 22px; text-decoration: none; }
nav a.link { text-decoration: none; opacity: .9; }
main { max-width: 820px; margin: 0 auto; padding: 28px 18px 60px; }
h1 { font-size: 38px; margin: 0 0 6px; }
.maint { background: var(--red); color: var(--cream); border-radius: 16px; padding: 14px 18px; margin: 16px 0; }
.item { background: #fffdf6; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 6px 6px 0 rgba(29,53,87,.18); padding: 18px 20px; margin: 16px 0; }
.item h2 { font-size: 22px; margin: 6px 0 8px; }
.item p { margin: 0; white-space: pre-line; line-height: 1.65; }
.badge { display: inline-block; border-radius: 999px; padding: 2px 11px 3px; font-size: 13px; color: #fff; background: var(--blue); }
.badge.patch { background: var(--teal); } .badge.banner { background: var(--yellow); color: var(--ink); } .badge.popup { background: var(--red); }
.date { color: var(--muted); font-size: 13px; margin-left: 8px; }
.muted { color: var(--muted); }
</style>
</head>
<body>
<nav><div class="inner">
  <a class="brand disp" href="/">Small Party World</a>
  <a class="link" href="/about/">게임 소개</a>
  <a class="link" href="/news/">소식</a>
</div></nav>
<main>
  <h1 class="disp">소식</h1>
  <p class="muted">공지사항과 업데이트 소식이에요.</p>
  <div id="maint" class="maint" hidden></div>
  <div id="list"><p class="muted">불러오는 중…</p></div>
  <p class="muted" style="margin-top:32px;font-size:14px"><a href="/support/">문의</a> · <a href="/privacy/">개인정보처리방침</a> · <a href="/terms/">이용약관</a></p>
</main>
<script>
(function () {
  var KIND = { notice: "공지", patch: "패치 노트", banner: "안내", popup: "알림" };
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  fetch("/api/notices?platform=web", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.maintenance && d.maintenance.on) {
        var m = document.getElementById("maint");
        m.textContent = "서버 점검 중" + (d.maintenance.message ? ": " + d.maintenance.message : "");
        m.hidden = false;
      }
      var html = (d.notices || []).map(function (n) {
        var date = (n.updated_at || "").slice(0, 10);
        return "<article class='item'><span class='badge " + n.kind + "'>" + (KIND[n.kind] || "공지") + "</span>" +
          "<span class='date'>" + esc(date) + "</span><h2 class='disp'>" + esc(n.title) + "</h2>" +
          (n.body ? "<p>" + esc(n.body) + "</p>" : "") + "</article>";
      }).join("");
      document.getElementById("list").innerHTML = html || "<p class='muted'>아직 소식이 없어요.</p>";
    })
    .catch(function () { document.getElementById("list").innerHTML = "<p class='muted'>소식을 불러오지 못했어요. 잠시 뒤 다시 와 주세요.</p>"; });
})();
</script>
</body>
</html>
