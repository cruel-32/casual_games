# main 브랜치에 푸시하면:
#   1) deploy  (홈서버의 셀프 호스티드 러너) — 게임 서버 재시작 + 웹(안내 페이지·웹 체험판·Windows zip) 빌드·배포
#   2) android (GitHub 리눅스 러너, 공개 저장소라 무료) — AAB 빌드 → Google Play 내부 테스트 트랙 업로드
# 수동 실행: GitHub > Actions > build-deploy > Run workflow
#
# 필요한 설정은 README "자동 빌드·배포(GitHub Actions)" 참고.
# 보안: 공개 저장소라서 pull_request 로는 절대 실행하지 않는다 (외부인 코드가 홈서버에서 돌 수 있음)

name: build-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-deploy-main
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"

jobs:
  deploy:
    name: 서버·웹 배포 (홈서버)
    runs-on: [self-hosted, homeserver]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 게임 서버 다시 빌드·재시작
        run: docker compose up -d --build small-party-world-server

      - name: 웹 + Windows zip 빌드·배포
        run: |
          docker compose build web-build
          docker compose --profile build run --rm web-build

      - name: 서버 상태 확인
        run: |
          sleep 5
          curl -fsS http://127.0.0.1:7778/status.json

  android:
    name: Android 빌드 (+ Google Play 업로드)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 서명 키가 없으면 건너뜀
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 시크릿이 없어 Android 빌드를 건너뜁니다"

      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot + 내보내기 템플릿 설치
        if: env.HAS_KEYSTORE == 'true'
        run: |
          V=$GODOT_VERSION
          wget -q "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip && sudo mv "Godot_v${V}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz" -O t.tpz
          unzip -q t.tpz -d t
          mkdir -p ~/.local/share/godot/export_templates/${V}.stable
          mv t/templates/* ~/.local/share/godot/export_templates/${V}.stable/
          rm -rf t t.tpz godot.zip

      - name: Android 빌드 템플릿 설치 (Gradle 빌드용, AAB 에 필요)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore

      - name: 에디터 설정 (Android SDK·JDK 경로, 디버그 키)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          mkdir -p ~/.config/godot
          V_MAJOR_MINOR=$(echo $GODOT_VERSION | cut -d. -f1,2)
          cat > ~/.config/godot/editor_settings-${V_MAJOR_MINOR}.tres <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES
          sed -i 's/^ *//' ~/.config/godot/editor_settings-${V_MAJOR_MINOR}.tres

      - name: 버전 코드 = 실행 번호 (업로드마다 증가해야 함)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          grep -n "version/" export_presets.cfg

      - name: AAB 내보내기
        if: env.HAS_KEYSTORE == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          godot --headless --path . --import >/dev/null 2>&1 || true
          godot --headless --path . --import >/dev/null 2>&1 || true
          mkdir -p build/android
          godot --headless --path . --export-release "Android" build/android/SmallPartyWorld.aab 2>&1 | tail -40
          rm -f release.keystore
          test -f build/android/SmallPartyWorld.aab
          ls -la build/android

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: android-aab
          path: build/android/SmallPartyWorld.aab
          retention-days: 14

      - name: Google Play 업로드 (내부 테스트 트랙)
        if: env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cloud.cloudish.spw
          releaseFiles: build/android/SmallPartyWorld.aab
          track: internal
          # 앱을 한 번도 출시(검토 통과)하지 않은 동안은 draft 만 허용된다. 첫 검토 통과 후 completed 로 바꾸면 바로 배포
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}